name: Trigger notification cron

# GitHub Actions' floor for scheduled workflows is every 5 minutes (and it can
# run a few minutes late under load) — still far better than Vercel Hobby's
# once-daily cron limit. This calls the same endpoint Vercel's daily cron
# hits; the route's own idempotent job-claiming means duplicate/overlapping
# runs are safe.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.APP_URL }}" ] && missing="$missing APP_URL"
          [ -z "${{ secrets.CRON_SECRET }}" ] && missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — set them at Settings > Secrets and variables > Actions. APP_URL must be the full site URL with scheme, e.g. https://e-commerce-website-web.vercel.app (no trailing slash)."
            exit 1
          fi
          case "${{ secrets.APP_URL }}" in
            http://*|https://*) ;;
            *) echo "::error::APP_URL secret is set but missing the http(s):// scheme — curl treats it as a malformed URL. Current value starts with: $(echo "${{ secrets.APP_URL }}" | cut -c1-12)..."; exit 1 ;;
          esac

      - name: Call /api/cron/notifications
        run: |
          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notifications")
          echo "HTTP $status"
          cat /tmp/body
          if [ "$status" -ge 300 ]; then
            echo "::error::Cron endpoint returned $status"
            exit 1
          fi
