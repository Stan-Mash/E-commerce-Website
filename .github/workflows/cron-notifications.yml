name: Trigger notification cron

# GitHub Actions' floor for scheduled workflows is every 5 minutes (and it can
# run a few minutes late under load) — still far better than Vercel Hobby's
# once-daily cron limit. This calls the same endpoint Vercel's daily cron
# hits; the route's own idempotent job-claiming means duplicate/overlapping
# runs are safe.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/notifications
        run: |
          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notifications")
          echo "HTTP $status"
          cat /tmp/body
          if [ "$status" -ge 300 ]; then
            echo "::error::Cron endpoint returned $status"
            exit 1
          fi
