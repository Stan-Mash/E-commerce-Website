name: CI

# Deploys are handled by the Vercel Git integration; this workflow gates
# merges with type-check, tests, and lint.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          # apps/web's test script uses --experimental-strip-types (Node 22.6+)
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx turbo run type-check

      - name: Lint
        run: npx turbo run lint

      - name: Tests
        run: npx turbo run test
